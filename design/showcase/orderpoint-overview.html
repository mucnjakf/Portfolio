<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OrderPoint showcase · Overview</title>
    <link rel="stylesheet" href="showcase.css" />
    <script>
      if (location.search.includes("dark")) document.documentElement.classList.add("dark");
    </script>
    <style>
      .canvas { --glow-x: 72%; --glow-y: 50%; }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="copy">
        <div class="brow">OrderPoint</div>
        <h1 class="headline">Scan, order, <em>served live.</em></h1>
        <p class="lede">Five real-time apps for guests, bartenders, the register and the owner.</p>

        <div class="features">
          <div class="feature">
            <span class="icon"><svg viewBox="0 0 24 24"><rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3M21 21v.01M12 7v3a2 2 0 0 1-2 2H7M3 12h.01M12 3h.01M12 16v.01M16 12h1M21 12v.01M12 21v-1"/></svg></span>
            QR ordering &amp; payment
          </div>
          <div class="feature">
            <span class="icon"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></span>
            Live bar queue
          </div>
          <div class="feature">
            <span class="icon"><svg viewBox="0 0 24 24"><rect width="20" height="12" x="2" y="6" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg></span>
            Register &amp; receipts
          </div>
          <div class="feature">
            <span class="icon"><svg viewBox="0 0 24 24"><path d="M22 7 13.5 15.5 8.5 10.5 2 17"/><path d="M16 7h6v6"/></svg></span>
            Inventory &amp; profit
          </div>
        </div>
      </div>

      <div class="browser" style="left: 500px; top: 64px; width: 800px">
        <div class="bar">
          <div class="dots"><span></span><span></span><span></span></div>
          <div class="url">admin.orderpoint.app</div>
        </div>
        <img data-screen="admin-dashboard" alt="" />
      </div>

      <div class="phone" style="left: 470px; top: 332px; width: 232px">
        <div class="screen"><img data-screen="cust-tracking" alt="" /></div>
      </div>

      <div class="phone" style="left: 930px; top: 388px; width: 232px">
        <div class="screen"><img data-screen="bt-tables" alt="" /></div>
      </div>

      <div class="tag" style="left: 1030px; top: 40px"><span class="dot"></span>Admin</div>
      <div class="tag" style="left: 520px; top: 306px"><span class="dot"></span>Customer</div>
      <div class="tag" style="left: 970px; top: 362px"><span class="dot"></span>Bartender</div>
    </div>

    <script>
      // Each screen exists in light and dark; pick the one matching this render
      const theme = document.documentElement.classList.contains("dark") ? "dark" : "light";
      document.querySelectorAll("img[data-screen]").forEach((img) => (img.src = `screens/orderpoint/${img.dataset.screen}-${theme}.webp`));
    </script>
  </body>
</html>
