<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OrderPoint showcase</title>
    <link rel="stylesheet" href="showcase.css" />
    <script>
      if (location.search.includes("dark")) document.documentElement.classList.add("dark");
    </script>
    <style>
      .canvas { --glow-x: 72%; --glow-y: 50%; }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="copy">
        <div class="brow">OrderPoint</div>
        <h1 class="headline">Scan, order, <em>served live.</em></h1>
        <p class="lede">Customer, bartender and admin apps sharing one real-time order flow.</p>

        <div class="features">
          <div class="feature">
            <span class="icon"><svg viewBox="0 0 24 24"><rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3M21 21v.01M12 7v3a2 2 0 0 1-2 2H7M3 12h.01M12 3h.01M12 16v.01M16 12h1M21 12v.01M12 21v-1"/></svg></span>
            QR table ordering
          </div>
          <div class="feature">
            <span class="icon"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></span>
            Live bartender queue
          </div>
          <div class="feature">
            <span class="icon"><svg viewBox="0 0 24 24"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg></span>
            Admin control center
          </div>
        </div>
      </div>

      <div class="browser" style="left: 500px; top: 64px; width: 800px">
        <div class="bar">
          <div class="dots"><span></span><span></span><span></span></div>
          <div class="url">admin.orderpoint.app</div>
        </div>
        <img src="screens/op-dashboard.png" alt="" />
      </div>

      <div class="phone" style="left: 470px; top: 332px; width: 232px">
        <div class="screen"><img src="screens/op-orders.png" alt="" /></div>
      </div>

      <div class="phone" style="left: 930px; top: 388px; width: 232px">
        <div class="screen"><img src="screens/op-ordered.png" alt="" /></div>
      </div>

      <div class="tag" style="left: 1030px; top: 40px"><span class="dot"></span>Admin</div>
      <div class="tag" style="left: 520px; top: 306px"><span class="dot"></span>Bartender</div>
      <div class="tag" style="left: 986px; top: 362px"><span class="dot"></span>Customer</div>
    </div>
  </body>
</html>
