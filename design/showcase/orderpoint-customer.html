<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OrderPoint showcase · Customer</title>
    <link rel="stylesheet" href="showcase.css" />
    <script>
      if (location.search.includes("dark")) document.documentElement.classList.add("dark");
    </script>
    <style>
      .canvas { --glow-x: 70%; --glow-y: 55%; }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="copy">
        <div class="brow">Customer app</div>
        <h1 class="headline">Order from the table, <em>no waiting.</em></h1>
        <p class="lede">Guests scan the table's QR code, then order, pay and follow it live.</p>

        <div class="features">
          <div class="feature">
            <span class="icon"><svg viewBox="0 0 24 24"><rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3M21 21v.01M12 7v3a2 2 0 0 1-2 2H7M3 12h.01M12 3h.01M12 16v.01M16 12h1M21 12v.01M12 21v-1"/></svg></span>
            QR code per table
          </div>
          <div class="feature">
            <span class="icon"><svg viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="5" rx="2"/><path d="M2 10h20"/></svg></span>
            Card or cash
          </div>
          <div class="feature">
            <span class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></span>
            Live order status
          </div>
        </div>
      </div>

      <div class="phone" style="left: 450px; top: 250px; width: 206px; z-index: 1">
        <div class="screen"><img data-screen="cust-menu" alt="" /></div>
      </div>

      <div class="phone" style="left: 632px; top: 140px; width: 206px; z-index: 2">
        <div class="screen"><img data-screen="cust-cocktails" alt="" /></div>
      </div>

      <div class="phone" style="left: 814px; top: 280px; width: 206px; z-index: 3">
        <div class="screen"><img data-screen="cust-pay" alt="" /></div>
      </div>

      <div class="phone" style="left: 996px; top: 170px; width: 206px; z-index: 4">
        <div class="screen"><img data-screen="cust-tracking" alt="" /></div>
      </div>

      <div class="tag" style="left: 476px; top: 224px"><span class="dot"></span>Menu</div>
      <div class="tag" style="left: 658px; top: 114px"><span class="dot"></span>Items</div>
      <div class="tag" style="left: 840px; top: 254px"><span class="dot"></span>Pay</div>
      <div class="tag" style="left: 1022px; top: 144px"><span class="dot"></span>Live status</div>
    </div>

    <script>
      // Each screen exists in light and dark; pick the one matching this render
      const theme = document.documentElement.classList.contains("dark") ? "dark" : "light";
      document.querySelectorAll("img[data-screen]").forEach((img) => (img.src = `screens/orderpoint/${img.dataset.screen}-${theme}.webp`));
    </script>
  </body>
</html>
